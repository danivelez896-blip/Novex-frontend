name: Verify exchange UI
on:
  push:
    branches:
      - feature/section-8-exchange-ui
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVEX_API_URL: http://127.0.0.1:9
      SUPABASE_URL: http://127.0.0.1:9
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:exchanges
      - run: npm run test:portal
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
